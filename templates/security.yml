# ============================================================================
# Devora Security Scan — caller workflow
#
# HOW TO INSTALL IN A PROJECT (any repo, any stack):
#   1. Copy this file to:  .github/workflows/security.yml
#   2. Commit & push. Done — the pipeline auto-detects the stack.
#
# For an EXISTING project with unknown backlog: set `enforce: false` for the
# first week, fix what the report shows, then flip it to true.
# ============================================================================
name: Security

on:
  pull_request:
  push:
    branches: [main, master, develop]
  schedule:
    - cron: "0 2 * * 1"   # weekly sweep, Mondays 02:00 UTC (new CVEs appear without code changes)
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: devora2025/devora-security-ci/.github/workflows/security-scan.yml@main
    with:
      enforce: true                 # false = report-only mode (rollout week)
      # severity: "CRITICAL,HIGH"   # what blocks the gate (Trivy severities)
      # strict_flutter_analyze: false
