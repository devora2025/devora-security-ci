# ============================================================================
# Devora DAST — OWASP ZAP baseline scan (reusable workflow)
#
# Passive scan of a RUNNING app (staging). Safe to run on a schedule: the
# baseline scan spiders the target and reports issues without attacking it.
# Call it from a project repo on a weekly cron with the staging URL.
# ============================================================================
name: Devora DAST (ZAP baseline)

on:
  workflow_call:
    inputs:
      target_url:
        description: "Full URL of the running staging environment to scan."
        type: string
        required: true
      fail_on_findings:
        description: "Fail the job when ZAP reports warnings (default: report only)."
        type: boolean
        required: false
        default: false

jobs:
  zap:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run ZAP baseline against staging
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ inputs.target_url }}
          allow_issue_writing: false
          fail_action: ${{ inputs.fail_on_findings }}
          artifact_name: zap-baseline-report
